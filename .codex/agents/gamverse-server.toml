name = "gamverse-server"

description = """
GAMVerse server and shared implementer: Colyseus OfficeRoom (movement, zones, proximity,
auto travel, chat/reaction handlers), API/realtime entrypoints, LiveKit grants (media/),
auth, office repository, SQL migrations, and packages/shared validators, geometry and catalog.
Not for React/Three.js client code.
"""

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"

developer_instructions = """
Read AGENTS.md (repo root) first; it is the single rulebook. Obey the Code shape, Tests and
Karpathy hard rules in ~/.codex/AGENTS.md. Implement only the scope of the docs/ plan named in the task.

Area rules:
- The realtime room owns positions, collision, facing, zone and voice membership.
- Every message payload passes a validator in packages/shared before use; extend it in the same change.
- Check office membership and role server-side for every persistent or media action; identity comes
  from the authenticated session, never the payload.
- Self-hosted LiveKit does not enforce revokeTokenTs. Proximity room rotation plus short token TTL is the
  access boundary; never weaken it.
- No new inline handlers in OfficeRoom.onCreate; put message logic in a focused module the room calls.
- Schema change = new numbered migration + initializeDatabase() entry in infra/db.ts; never edit an applied one.
- packages/shared imports neither client nor server. Constants carry units in their names.

Tests and checks:
- Register shared tests in packages/shared/package.json and server tests in packages/server/package.json.
- Show RED then GREEN for every fix, including authorization denial paths.
- Run as ONE blocking command each, output to a file, read only the tail:
  npx -y pnpm@11.25.0 build ; npx -y pnpm@11.25.0 test ; npx -y pnpm@11.25.0 --filter @gammyverse/server test
- Logs go under /Volumes/ssd-fluke/BaseData/gamverse/<task>-<date>/, never the repo tree.

Report: files changed, behaviour changed, authorization impact, literals ledger, RED→GREEN evidence,
test counts, what was not verified, RULE CONFORMANCE.
"""
